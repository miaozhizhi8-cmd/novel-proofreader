  <div class="modal-backdrop" id="paletteModal"><div class="modal"><h3 id="modalTitle">编辑标色</h3><div class="form-row"><label>名称</label><input id="editName" maxlength="8"></div><div class="form-row"><label>说明</label><input id="editMeaning" maxlength="36"></div><div class="form-row"><label>颜色</label><input id="editColor" type="color"></div><div class="modal-actions"><button class="btn" id="deletePalette" type="button">删除</button><button class="btn" id="cancelPalette" type="button">取消</button><button class="btn primary" id="savePalette" type="button">保存</button></div></div></div>
  <div class="toast" id="toast"></div>
  <script>
  (()=>{
    'use strict';
    const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
    const STORAGE='novelPaletteState.v1';
    const DEFAULT_PALETTE=[
      {id:'dialogue',name:'对话',meaning:'人物对白、问答与说话次序',color:'#ef615c',enabled:true},
      {id:'action',name:'动作',meaning:'连续动作、行为和反应链',color:'#f0a33b',enabled:true},
      {id:'description',name:'描写',meaning:'环境、外貌和场景细节',color:'#3981ee',enabled:true},
      {id:'psychology',name:'心理',meaning:'情绪、判断和心理反应',color:'#9a6de2',enabled:true},
      {id:'structure',name:'情节结构',meaning:'事件顺序、人物关系与场景骨架',color:'#35a56f',enabled:true}
    ];
    const DEMO={leftTitle:'示例·疑似文',leftAuthor:'张三',leftSource:'用户示例',rightTitle:'示例·原文',rightAuthor:'原作者',rightSource:'用户示例',leftText:'夏日炎炎，张三抱着篮球突然从班级前门冲进来，说：“不好了！李四被人打了！”\n\n班里同学纷纷起身，王五冲过去抓住张三的胳膊，紧张地问：“怎么回事？他在哪？怎么被人打了？”\n\n张三摇头，“我也是听人说的，我不知道在哪”\n\n王五丢开张三的胳膊，骂了句：“真没用，可恶”',rightText:'蝉鸣阵阵，正是夏天最热的一天。\n\n班里人都在安静自习，这时候前门突然被人撞开，大家定睛看过去，周一抱着足球从门口冲了进来，说：“不好了！路六，路六他被人打了！”\n\n听他这样说，班里同学都吃了一惊，路六可是他们班的班草，平时很多人都喜欢他，怎么会被人打？\n\n赵七腾地起身冲过去，攥住周一的衣领，问：“路六他人呢？怎么会被打？”\n\n周一摇头，“我不知道，我也只是路过听别人说的……”'};
    let palette=structuredClone(DEFAULT_PALETTE), matches=[], editingId=null,notes={};
    const ids=['leftTitle','leftAuthor','leftSource','rightTitle','rightAuthor','rightSource','leftText','rightText','exportRatio'];
    const stop=new Set('的了着过是在和与及并而也都就又还很更最把被让给从向对将于中上下来去有无这那其一个些我你他她它们啊呀吗呢吧地得所为以'.split(''));
    const lex={action:['冲','跑','走','站','起身','抓','攥','抱','推','拉','扔','丢','打','撞','摇头','点头','回头','抬头','低头','转身','伸手','放开','踢','扑','坐','跪','抬','捂','握','拍','看','瞥','盯'],description:['夏','冬','春','秋','天','雨','雪','风','蝉','阳光','月光','夜','清晨','教室','班级','门口','窗','街','屋','房间','颜色','声音','安静','炎热','寒冷'],psychology:['紧张','害怕','惊','愣','喜欢','讨厌','担心','怀疑','愤怒','生气','难过','高兴','意识','觉得','想','心里','可恶','吃惊','慌','疑惑'],speech:['说','问','答','喊','叫','骂','道','开口','低声','大声','解释']};
    const conceptGroups=[['stand',['起身','站起','腾地','站了起来']],['rush',['冲过去','冲向','跑过去','奔过去','扑过去']],['grab',['抓住','攥住','揪住','扯住','拽住']],['release',['丢开','放开','松开','甩开']],['ask',['问','追问','询问']],['where',['在哪','哪里','人呢','何处']],['cause',['怎么回事','怎么会','为什么','为何']],['attack',['被人打','被打','挨打']],['hear',['听人说','听别人说','听说']],['unknown',['不知道','不清楚']],['shake',['摇头']],['group',['班里同学','同学们','班里人']],['enter',['冲进来','闯进来','撞开门']]];
    function conceptSequence(text){return conceptGroups.map(([key,words])=>({key,pos:Math.min(...words.map(w=>{const i=text.indexOf(w);return i<0?Infinity:i}))})).filter(x=>Number.isFinite(x.pos)).sort((a,b)=>a.pos-b.pos).map(x=>x.key)}
    function paragraphSegments(text){const out=[];const re=/[^\n][\s\S]*?(?=\n\s*\n|$)/g;let m;while((m=re.exec(text))){const raw=m[0].trim();if(raw.replace(/\s/g,'').length<6)continue;const offset=m[0].indexOf(raw);out.push({raw,start:m.index+Math.max(0,offset),end:m.index+Math.max(0,offset)+raw.length,concepts:conceptSequence(raw)})}return out}
    function conceptMatch(a,b){const A=new Set(a.concepts),B=new Set(b.concepts),shared=[...A].filter(x=>B.has(x));if(shared.length<3)return null;const coverage=shared.length/Math.max(1,Math.min(A.size,B.size)),balanced=shared.length/Math.max(1,Math.max(A.size,B.size));if(balanced<.5)return null;let j=0,orderedHits=0;for(const x of a.concepts){const k=b.concepts.indexOf(x,j);if(k>=0){orderedHits++;j=k+1}}const order=orderedHits/Math.max(1,Math.min(a.concepts.length,b.concepts.length));const lengthRatio=Math.min(a.raw.length,b.raw.length)/Math.max(a.raw.length,b.raw.length);const total=Math.min(.96,.4+.2*coverage+.26*balanced+.1*order+.04*Math.sqrt(lengthRatio));return{total,literal:scorePair(feature(a.raw),feature(b.raw)).literal,elements:balanced,order,lengthRatio}}
    function rangesOverlap(a,b){return a.start<b.end&&b.start<a.end}
    function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1900)}
    function shade(hex,alpha=.2){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${alpha})`}
    function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function renderPalette(){const box=$('#paletteList');box.innerHTML=palette.map(p=>`<div class="palette-chip ${p.enabled?'':'off'}"><input type="checkbox" ${p.enabled?'checked':''} data-toggle="${p.id}" aria-label="启用${esc(p.name)}"><button class="color-square" type="button" data-edit="${p.id}" style="--palette-color:${p.color}" title="修改${esc(p.name)}的颜色和说明"></button><span class="chip-copy"><b>${esc(p.name)}</b></span></div>`).join('')+`<button class="palette-chip palette-add" id="addPalette" type="button"><span>＋</span> 新建标色</button>`;
      $$('[data-toggle]').forEach(el=>el.onchange=()=>{const p=palette.find(x=>x.id===el.dataset.toggle);p.enabled=el.checked;renderPalette();persist()});
      $$('[data-color]').forEach(el=>el.oninput=()=>{const p=palette.find(x=>x.id===el.dataset.color);p.color=el.value;renderPalette();persist();if(matches.length){renderResults();renderInlineResults()}});
      $$('[data-edit]').forEach(el=>el.onclick=()=>openPalette(el.dataset.edit));$('#addPalette').onclick=()=>openPalette(null);
    }
    function openPalette(id){editingId=id;const p=palette.find(x=>x.id===id)||{name:'自定义',meaning:'自定义比对类型',color:'#555555'};$('#modalTitle').textContent=id?'编辑标色':'新增标色';$('#editName').value=p.name;$('#editMeaning').value=p.meaning;$('#editColor').value=p.color;$('#deletePalette').style.visibility=id?'visible':'hidden';$('#paletteModal').classList.add('show')}
    function closePalette(){$('#paletteModal').classList.remove('show')}
    $('#savePalette').onclick=()=>{const name=$('#editName').value.trim(),meaning=$('#editMeaning').value.trim();if(!name||!meaning)return toast('请填写名称和说明');if(editingId){Object.assign(palette.find(x=>x.id===editingId),{name,meaning,color:$('#editColor').value})}else palette.push({id:'custom_'+Date.now(),name,meaning,color:$('#editColor').value,enabled:true});closePalette();renderPalette();persist();if(matches.length){renderResults();renderInlineResults()}};
    $('#deletePalette').onclick=()=>{if(palette.length<=1)return toast('至少保留一种标色');palette=palette.filter(x=>x.id!==editingId);closePalette();renderPalette();persist()};$('#cancelPalette').onclick=closePalette;$('#paletteModal').onclick=e=>{if(e.target.id==='paletteModal')closePalette()};
    function persist(){const data={palette,notes};ids.forEach(id=>data[id]=$('#'+id).value);localStorage.setItem(STORAGE,JSON.stringify(data))}
    function restore(){try{const d=JSON.parse(localStorage.getItem(STORAGE)||'{}');if(Array.isArray(d.palette)&&d.palette.length)palette=d.palette;if(d.notes&&typeof d.notes==='object')notes=d.notes;ids.forEach(id=>{if(d[id]!==undefined)$('#'+id).value=d[id]})}catch(e){}updateCounts();updateStrict()}
    function updateCounts(){[['leftText','leftCount'],['rightText','rightCount']].forEach(([a,b])=>{const n=$('#'+a).value.length;$('#'+b).textContent=n.toLocaleString()+' / 20,000';$('#'+b).classList.toggle('over',n>=20000)});const total=$('#leftText').value.length+$('#rightText').value.length;$('#guideStatus').textContent=total?`已输入 ${total.toLocaleString()} 字 · 本地处理`:'等待粘贴文章'}
    function updateStrict(){const v=+$('#strictness').value;$('#strictValue').textContent=v+'%';$('#strictness').style.setProperty('--progress',v+'%')}
    ids.forEach(id=>$('#'+id).addEventListener('input',()=>{updateCounts();if(id==='strictness')updateStrict();persist()}));
    function splitText(text){const arr=[];let start=0,buf='';for(let i=0;i<text.length;i++){const c=text[i];buf+=c;const cleanLength=buf.replace(/\s/g,'').length;const hardBreak=/[。！？!?；;\n]/.test(c);const clauseBreak=/[，,：:]/.test(c)&&cleanLength>=8;if(hardBreak||clauseBreak||buf.length>=80){const raw=buf.trim();if(raw.replace(/\s/g,'').length>=4)arr.push({raw,start,end:i+1});buf='';start=i+1}}if(buf.trim().length>=4)arr.push({raw:buf.trim(),start,end:text.length});return arr.slice(0,1600)}
    function norm(s){return s.toLowerCase().replace(/[“”‘’「」『』（）()《》〈〉，。！？；：、,.!?;:\s—…·\-]/g,'').split('').filter(c=>!stop.has(c)).join('')}
    function grams(s,n=2){const out=new Set();for(let i=0;i<=s.length-n;i++)out.add(s.slice(i,i+n));return out}
    function intersection(a,b){let n=0;for(const x of a)if(b.has(x))n++;return n}
    function hitList(s,list){return list.filter(x=>s.includes(x))}
    function classify(s){if(/[“”「」『』]/.test(s)||hitList(s,lex.speech).length>=2)return'dialogue';const scores={action:hitList(s,lex.action).length,description:hitList(s,lex.description).length,psychology:hitList(s,lex.psychology).length};const top=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];return top[1]?top[0]:'structure'}
    function feature(s){const n=norm(s),g=grams(n),chars=new Set(n),actions=hitList(s,lex.action),descs=hitList(s,lex.description),psych=hitList(s,lex.psychology),speech=hitList(s,lex.speech);return{n,g,chars,actions,descs,psych,speech,cat:classify(s)}}
    function ordered(a,b){if(!a.length||!b.length)return 0;let j=0,hit=0;for(const c of a){const k=b.indexOf(c,j);if(k>=0){hit++;j=k+1}}return hit/Math.min(a.length,b.length)}
    function semantic(A,B){const x=[...A.actions,...A.descs,...A.psych,...A.speech],y=new Set([...B.actions,...B.descs,...B.psych,...B.speech]);if(!x.length||!y.size)return 0;return x.filter(v=>y.has(v)).length/Math.max(2,Math.min(x.length,y.size))}
    function scorePair(A,B){const inter=intersection(A.g,B.g),contain=inter/Math.max(1,Math.min(A.g.size,B.g.size)),jac=inter/Math.max(1,A.g.size+B.g.size-inter),char=intersection(A.chars,B.chars)/Math.max(1,Math.min(A.chars.size,B.chars.size)),seq=Math.max(ordered(A.n,B.n),ordered(B.n,A.n)),sem=semantic(A,B),cat=A.cat===B.cat?1:0,lengthRatio=Math.min(A.n.length,B.n.length)/Math.max(1,Math.max(A.n.length,B.n.length));let total=.34*contain+.12*jac+.21*char+.18*seq+.11*sem+.04*cat;total*=.68+.32*Math.sqrt(lengthRatio);return{total:Math.min(1,total),literal:Math.min(1,.65*contain+.35*jac),elements:Math.min(1,.55*sem+.3*char+.15*cat),order:seq,lengthRatio}}
    function analyze(){const lt=$('#leftText').value.trim(),rt=$('#rightText').value.trim();if(!lt||!rt)return toast('请先粘贴两篇文章');if(lt.length>20000||rt.length>20000)return toast('单篇文章不能超过 20,000 字');const active=new Set(palette.filter(p=>p.enabled).map(p=>p.id));if(!active.size)return toast('至少勾选一种标色');$('#compareBtn').textContent='正在分析…';$('#compareBtn').disabled=true;setTimeout(()=>{
      const L=splitText(lt).map(x=>({...x,f:feature(x.raw)})),R=splitText(rt).map(x=>({...x,f:feature(x.raw)}));const index=new Map();R.forEach((r,j)=>r.f.g.forEach(g=>{if(!index.has(g))index.set(g,[]);index.get(g).push(j)}));const usedR=new Set(),out=[];const strict=+$('#strictness').value,threshold=.79-strict*.0037;
      L.forEach((l,i)=>{if(!active.has(l.f.cat)&&!active.has('structure'))return;const cand=new Map();l.f.g.forEach(g=>(index.get(g)||[]).forEach(j=>cand.set(j,(cand.get(j)||0)+1)));let ids=[...cand.entries()].sort((a,b)=>b[1]-a[1]).slice(0,18).map(x=>x[0]);if(strict>75&&ids.length<8)ids.push(...R.map((_,j)=>j).filter(j=>!ids.includes(j)).slice(0,8));let best=null;ids.forEach(j=>{const m=scorePair(l.f,R[j].f);if(!best||m.total>best.m.total)best={j,m}});if(best&&best.m.total>=threshold){if(best.m.lengthRatio<.28)return;const r=R[best.j],cat=active.has(l.f.cat)?l.f.cat:(active.has(r.f.cat)?r.f.cat:'structure');if(!active.has(cat))return;out.push({left:l,right:r,cat,score:best.m.total,...best.m});usedR.add(best.j)}});
      if(active.has('action')||active.has('structure')){const LP=paragraphSegments(lt),RP=paragraphSegments(rt),usedParagraphs=new Set();LP.forEach(left=>{let best=null;RP.forEach((right,j)=>{if(usedParagraphs.has(j))return;const m=conceptMatch(left,right);if(m&&(!best||m.total>best.m.total))best={right,j,m}});if(best){const hasAction=left.concepts.some(x=>['stand','rush','grab','release','enter'].includes(x));const cat=hasAction&&active.has('action')?'action':'structure';if(active.has(cat)){out.push({left,right:best.right,cat,score:best.m.total,...best.m});usedParagraphs.add(best.j)}}})}
      const selected=[];out.sort((a,b)=>b.score-a.score||((b.left.end-b.left.start)-(a.left.end-a.left.start))).forEach(m=>{if(selected.some(x=>rangesOverlap(m.left,x.left)||rangesOverlap(m.right,x.right)))return;selected.push(m)});matches=selected.slice(0,120);renderResults();renderInlineResults();$('#compareBtn').textContent='重新分析';$('#compareBtn').disabled=false;persist();
    },30)}
    function riskLabel(m){if(m.literal>.68)return'文字表达高度接近';if(m.elements>.58&&m.order>.64)return'动作/场景链与顺序接近';if(m.order>.72)return'叙述推进顺序接近';if(m.elements>.48)return'场景或行为要素接近';return'存在改写式相似线索'}
    function renderResults(){const body=$('#resultBody'),L=$('#leftText').value,R=$('#rightText').value;const uniqueL=new Set(),uniqueR=new Set();matches.forEach(m=>{for(let i=m.left.start;i<m.left.end;i++)uniqueL.add(i);for(let i=m.right.start;i<m.right.end;i++)uniqueR.add(i)});const weighted=matches.length?matches.reduce((s,m)=>s+m.score,0)/matches.length:0;const coverage=Math.min(1,(uniqueL.size/Math.max(1,L.length)+uniqueR.size/Math.max(1,R.length))/2);const risk=Math.round((weighted*.72+coverage*.28)*100);$('#riskScore').textContent=risk+'%';$('#matchCount').textContent=matches.length;$('#leftCoverage').textContent=Math.round(uniqueL.size/Math.max(1,L.length)*100)+'%';$('#rightCoverage').textContent=Math.round(uniqueR.size/Math.max(1,R.length)*100)+'%';$('#leftHeaderOut').textContent=$('#leftTitle').value||'疑似侵权文';$('#rightHeaderOut').textContent=$('#rightTitle').value||'原文';$('#resultSubtitle').textContent=`严格率 ${$('#strictness').value}% · ${matches.length?'请逐条复核上下文':'未发现达到当前阈值的片段'}`;
      if(!matches.length){body.innerHTML='<div class="result-empty"><b>当前严格率下没有匹配片段</b>可提高严格率捕捉更宽泛的改写和情节线索，或检查是否关闭了需要的标色类型。</div>';return}
      body.innerHTML=matches.map((m,i)=>{const p=palette.find(x=>x.id===m.cat)||palette[0],reason=riskLabel(m);return`<article class="match-row" id="match-${i}"><div class="match-cell"><p class="excerpt"><span class="highlight" style="--hl:${shade(p.color,.2)};--edge:${p.color}">${esc(m.left.raw)}</span></p></div><div class="match-cell"><p class="excerpt"><span class="highlight" style="--hl:${shade(p.color,.2)};--edge:${p.color}">${esc(m.right.raw)}</span></p></div><div class="match-cell explain"><div class="explain-head"><span class="type-tag" style="--tag:${shade(p.color,.22)}">${esc(p.name)}</span><span class="score">${Math.round(m.score*100)}%</span></div><p class="reason"><b>${reason}</b><br>${esc(p.meaning)}。此项用于提示人工查看人物替换、同义改写和前后事件是否形成连续对应。</p><div class="metrics"><span class="metric">字面 ${Math.round(m.literal*100)}</span><span class="metric">要素 ${Math.round(m.elements*100)}</span><span class="metric">顺序 ${Math.round(m.order*100)}</span></div></div></article>`}).join('')
    }
    function exportMeta(side){const title=$('#'+side+'Title').value.trim()||(side==='left'?'疑似侵权文章':'原文信息'),author=$('#'+side+'Author').value.trim(),source=$('#'+side+'Source').value.trim();return{title,detail:[author,source].filter(Boolean).join(' · ')}}
    function buildExportSnapshot(){
      const left=exportMeta('left'),right=exportMeta('right'),node=document.createElement('section');
      node.className='export-snapshot';
      node.innerHTML=`<header class="export-snapshot-head"><div class="export-snapshot-title">调色盘 · 文本对照</div><div class="export-snapshot-summary">匹配 <b>${matches.length}</b>　相似度 <b>${esc($('#inlineSimilarity').textContent)}</b></div></header><div class="export-grid"><article class="export-paper left"><header class="export-paper-head"><div class="export-paper-side"><i></i><span>疑似侵权文章</span></div><div class="export-meta-title">${esc(left.title)}</div><div class="export-meta-detail">${esc(left.detail)}</div></header><div class="export-body">${$('#leftInlineOutput').innerHTML}</div></article><article class="export-paper right"><header class="export-paper-head"><div class="export-paper-side"><i></i><span>原文信息</span></div><div class="export-meta-title">${esc(right.title)}</div><div class="export-meta-detail">${esc(right.detail)}</div></header><div class="export-body">${$('#rightInlineOutput').innerHTML}</div></article></div><footer class="export-snapshot-foot">结果仅供人工复核 · ${new Date().toLocaleDateString('zh-CN')}</footer>`;
      node.querySelectorAll('.inline-note').forEach(wrap=>{const editor=wrap.querySelector('.note-editor'),value=String(notes[wrap.dataset.noteKey]??editor?.textContent??'').trim();if(!value){wrap.remove();return}editor.textContent=value;editor.removeAttribute('contenteditable');wrap.classList.add('has-content');wrap.classList.remove('show')});
      node.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));node.querySelectorAll('.active').forEach(el=>el.classList.remove('active'));return node
    }
    function canvasDownload(canvas,name){const a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove()}
    async function renderSnapshotSlice(stage,offset,height){const width=1080,allCss=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n'),markup=`<div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;overflow:hidden;background:#fff"><style>${allCss}</style><div style="width:${width}px;transform:translateY(-${offset}px)">${stage.outerHTML}</div></div>`,svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}"><foreignObject width="100%" height="100%">${markup}</foreignObject></svg>`,img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(img,0,0);return canvas}
    async function drawReportPages(){if(!matches.length)return toast('请先生成调色结果');closeInlineSelection();const host=document.createElement('div'),stage=buildExportSnapshot();host.className='export-capture-host';host.appendChild(stage);document.body.appendChild(host);await document.fonts?.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const mode=$('#exportRatio').value,totalHeight=Math.ceil(stage.scrollHeight),pageHeight=mode==='3:4'?1440:mode==='16:9'?608:Math.min(30000,totalHeight),pageCount=Math.max(1,Math.ceil(totalHeight/pageHeight));try{toast(`正在生成 ${pageCount} 张手机双栏图片`);for(let i=0;i<pageCount;i++){const canvas=await renderSnapshotSlice(stage,i*pageHeight,pageHeight);canvasDownload(canvas,`调色盘-双栏-${mode.replace(':','x')}-${String(i+1).padStart(2,'0')}.png`);await new Promise(r=>setTimeout(r,260))}}catch(e){console.error(e);toast('图片生成失败，请重试')}finally{host.remove()}}
    function printFullSnapshot(){if(!matches.length)return toast('请先生成调色结果');closeInlineSelection();$('#printSnapshot')?.remove();const stage=buildExportSnapshot();stage.id='printSnapshot';document.body.appendChild(stage);setTimeout(()=>window.print(),80)}
    window.addEventListener('afterprint',()=>$('#printSnapshot')?.remove());
    function noteKey(m){const s=m.left.raw+'\u241f'+m.right.raw;let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return'n'+(h>>>0).toString(36)}
    function buildInlineText(text,side){
      const pieces=matches.map((m,index)=>({index,seg:side==='left'?m.left:m.right,cat:m.cat,key:noteKey(m)})).sort((a,b)=>a.seg.start-b.seg.start),accepted=[];
      let lastEnd=-1;
      for(const item of pieces){if(item.seg.start<lastEnd)continue;accepted.push(item);lastEnd=item.seg.end}
      const notesAt=new Map;
      accepted.forEach(item=>{const lineEnd=text.indexOf('\n',item.seg.end),position=lineEnd<0?text.length:lineEnd+1;if(!notesAt.has(position))notesAt.set(position,[]);notesAt.get(position).push(item)});
      const notePositions=[...notesAt.keys()].sort((a,b)=>a-b);
      let cursor=0,markIndex=0,noteIndex=0,html='';
      const noteHtml=item=>{const p=palette.find(x=>x.id===item.cat)||palette[0],note=notes[item.key]||'',noteClass=note.trim()?' has-content':'';return`<span class="inline-note${noteClass}" data-note-match="${item.index}" data-note-key="${item.key}" style="--note-color:${p.color}"><span class="note-editor" contenteditable="true" spellcheck="false">${esc(note)}</span></span>`};
      while(markIndex<accepted.length||noteIndex<notePositions.length){
        const item=accepted[markIndex],notePosition=notePositions[noteIndex]??Infinity,markPosition=item?.seg.start??Infinity;
        if(notePosition<=markPosition){if(notePosition>=cursor){html+=esc(text.slice(cursor,notePosition));cursor=notePosition;html+=notesAt.get(notePosition).map(noteHtml).join('')}noteIndex++;continue}
        if(item.seg.start>=cursor){const p=palette.find(x=>x.id===item.cat)||palette[0];html+=esc(text.slice(cursor,item.seg.start));html+=`<mark class="inline-highlight" data-match="${item.index}" style="--hl:${shade(p.color,.28)};--mark-color:${p.color}">${esc(text.slice(item.seg.start,item.seg.end))}</mark>`;cursor=item.seg.end}markIndex++
      }
      html+=esc(text.slice(cursor));return html
    }
    function renderInlineResults(){const left=$('#leftInlineOutput'),right=$('#rightInlineOutput');left.innerHTML=buildInlineText($('#leftText').value,'left');right.innerHTML=buildInlineText($('#rightText').value,'right');$('#leftEditorWrap').classList.add('reviewing');$('#rightEditorWrap').classList.add('reviewing');const similarity=matches.length?Math.round(matches.reduce((s,m)=>s+m.score,0)/matches.length*100):0;$('#inlineMatchCount').textContent=matches.length;$('#inlineSimilarity').textContent=similarity+'%';$('#riskScore').textContent=similarity+'%';$('#inlineSummary').classList.add('show');$('#guideStatus').textContent=matches.length?`已标出 ${matches.length} 组对应内容`:'当前严格率下没有匹配内容';$('#inlineIssueCard').classList.remove('show');requestAnimationFrame(renderPaneLabels)}
    function renderPaneLabels(){const rail=$('#paneLabels'),out=$('#rightInlineOutput');if(!rail||!out)return;const marks=[...out.querySelectorAll('.inline-highlight')];rail.innerHTML=marks.map(mark=>{const i=Number(mark.dataset.match),m=matches[i],p=palette.find(x=>x.id===m?.cat)||palette[0];return`<button class="edge-tag" type="button" data-match="${i}" style="--tag-color:${p.color};top:${Math.max(8,mark.offsetTop+4)}px" title="${esc(p.name)} · ${Math.round((m?.score||0)*100)}%"><span>${esc(p.name)} · ${Math.round((m?.score||0)*100)}%</span></button>`}).join('')}
    function closeInlineSelection(){$$('.inline-highlight').forEach(x=>x.classList.remove('active'));$$('.inline-note').forEach(x=>x.classList.remove('show'));$('#paneLabels').querySelectorAll('.edge-tag').forEach(x=>x.classList.remove('open'));$('#inlineIssueCard').classList.remove('show')}
    function selectInlineMatch(index){const m=matches[index];if(!m)return;const current=$('#paneLabels').querySelector(`[data-match="${index}"]`),wasOpen=current?.classList.contains('open');closeInlineSelection();if(wasOpen)return;$$('.inline-highlight').forEach(x=>x.classList.toggle('active',Number(x.dataset.match)===index));$$('.inline-note').forEach(x=>x.classList.toggle('show',Number(x.dataset.noteMatch)===index));current?.classList.add('open');requestAnimationFrame(()=>{['left','right'].forEach(side=>{const out=$('#'+side+'InlineOutput'),mark=out.querySelector(`[data-match="${index}"]`);if(!mark)return;const outRect=out.getBoundingClientRect(),markRect=mark.getBoundingClientRect(),target=out.scrollTop+(markRect.top-outRect.top)-(out.clientHeight-markRect.height)/2;out.scrollTo({top:Math.max(0,target),behavior:'smooth'})})})}
    function enterEditMode(){$('#leftEditorWrap').classList.remove('reviewing');$('#rightEditorWrap').classList.remove('reviewing');$('#inlineSummary').classList.remove('show');$('#inlineIssueCard').classList.remove('show');$('#paneLabels').innerHTML='';updateCounts()}
    $('#paneLabels').addEventListener('click',e=>{const tag=e.target.closest('.edge-tag');if(tag)selectInlineMatch(Number(tag.dataset.match))});$('#leftInlineOutput').addEventListener('click',e=>{const mark=e.target.closest('.inline-highlight');if(mark)selectInlineMatch(Number(mark.dataset.match))});$('#rightInlineOutput').addEventListener('click',e=>{const mark=e.target.closest('.inline-highlight');if(mark)selectInlineMatch(Number(mark.dataset.match))});document.addEventListener('input',e=>{const editor=e.target.closest('.note-editor');if(!editor)return;const wrap=editor.closest('.inline-note'),key=wrap.dataset.noteKey,value=editor.innerText;notes[key]=value;$$(`.inline-note[data-note-key="${key}"]`).forEach(noteWrap=>{const other=noteWrap.querySelector('.note-editor');if(other!==editor&&other.innerText!==value)other.innerText=value;noteWrap.classList.toggle('has-content',!!value.trim())});persist()});document.addEventListener('click',e=>{const note=e.target.closest('.inline-note');if(note){if(!note.classList.contains('show'))selectInlineMatch(Number(note.dataset.noteMatch));return}if(!e.target.closest('#paneLabels')&&!e.target.closest('.inline-highlight'))closeInlineSelection()});
    function renderEdgeLabels(){const rail=$('#resultLabels');if(!rail)return;const rows=$$('.match-row');rail.innerHTML=rows.map((row,i)=>{const m=matches[i],p=palette.find(x=>x.id===m?.cat)||palette[0];return`<button class="edge-tag" type="button" data-row="${i}" style="--tag-color:${p.color}" title="${esc(p.name)} · ${Math.round((m?.score||0)*100)}%"><span>${esc(p.name)} · ${Math.round((m?.score||0)*100)}%</span></button>`}).join('');requestAnimationFrame(()=>{rail.querySelectorAll('.edge-tag').forEach((tag,i)=>{const row=rows[i];if(row)tag.style.top=Math.max(40,row.offsetTop+12)+'px'})})}
    const labelObserver=new MutationObserver(()=>renderEdgeLabels());labelObserver.observe($('#resultBody'),{childList:true});$('#resultLabels').addEventListener('click',e=>{const tag=e.target.closest('.edge-tag');if(!tag)return;const index=Number(tag.dataset.row),row=$('#match-'+index),wasOpen=tag.classList.contains('open');$$('.edge-tag').forEach(x=>x.classList.remove('open'));$$('.match-row').forEach(x=>x.classList.remove('focused'));if(!wasOpen){const p=palette.find(x=>x.id===matches[index]?.cat)||palette[0];tag.classList.add('open');row?.classList.add('focused');row?.style.setProperty('--focus-color',p.color)}row?.scrollIntoView({behavior:'smooth',block:'center'})});window.addEventListener('resize',()=>renderEdgeLabels());
    function autoGrowMeta(el){el.style.height='auto';el.style.height=Math.max(32,el.scrollHeight)+'px'}
    $$('.meta-source').forEach(el=>{autoGrowMeta(el);el.addEventListener('input',()=>autoGrowMeta(el))});
    function clearSide(side){const label=side==='left'?'左栏':'右栏';if(!confirm(`确定清空${label}的表头和正文吗？`))return;enterEditMode();[side+'Title',side+'Author',side+'Source',side+'Text'].forEach(id=>$('#'+id).value='');autoGrowMeta($('#'+side+'Source'));matches=[];$('#resultsSection').classList.add('hidden');updateCounts();persist();toast(`${label}已清空`)}
    $('#clearLeftBtn').onclick=()=>clearSide('left');$('#clearRightBtn').onclick=()=>clearSide('right');
    $('#compareBtn').onclick=analyze;$('#compareTopBtn').onclick=analyze;$('#imageBtn').onclick=drawReportPages;$('#pdfBtn').onclick=printFullSnapshot;
    restore();$$('.meta-source').forEach(autoGrowMeta);renderPalette();
  })();
  </script>
</body>
